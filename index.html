<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Powerfull</title>
    <style>
        * {
            margin: 0;
            padding: auto;
            box-sizing: border-box;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }

        .container {
            height: 100vh;
        }

        header {
            height: 5%;
            margin-top: 32px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }


        header ul li {
            list-style-type: none;
            display: inline-block;
            padding-left: 20px;

        }
        header ul{
            margin-left: 400px;
        }

        main {
            height: 95%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .con1 {
            /* background-color: pink; */
            width: 500px;
            margin-left: 280px;
        }

       

        .small a {
            background-color: black;
            color: #fff;
            padding: 8px;
            border-radius: 20px;
            font-weight: 700;

        }

        .small span {
            color: grey;
            letter-spacing: 5px;
            margin-left: 10px;
        }

        .con1 h1 {
            font-size: 50px;
            font-weight: bolder;
            margin: 40px 0px;
        }

        .con1 p {
            border: 2px solid;
            width: 400px;
            font-size: 23px;
            color: grey;
            letter-spacing: 1px;
            font-weight: 400;
            margin-bottom: 50px;
        }

        .con1 button {
            padding: 17px 40px;
            border: 0;
            background-color: #FF5E5E;
            color: #fff;
            font-weight: 700;
            font-family: sans-serif;
            letter-spacing: 2px;
            border-radius: 5px;
        }

        .con1 a  {
            color: grey;
            letter-spacing: 5px;
            text-decoration: none;

        }
        .con1 a span{
            padding-left: 30px;
        }
        .iosa{
            position: fixed;
            top: 0;
            right: 0;
            z-index: -100;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <img src="Group.png" alt="Powerfull img header">
            <ul>
                <li>PRODUCT</li>
                <li>FEATURES</li>
                <li>PRICING</li>
                <li>@</li>
                <li>LOGIN</li>
            </ul>
        </header>

        <main>
            <div class="con1">
                <div class="small">
                    <a href="#">NEW</a>
                    <span>MONOGRAPH DASHBOARD</span>
                </div>
                <h1>POWERFUL INSIGHTS INTO YOUR TEAM</h1>
                <p>Project planning and time tracking for agile teams</p>
                <a href="#">
                    <button>SCHEDULE A DEMO</button>
                    <span>TO SEE A PREVIEW</span>
                </a>
            </div>
            <div class="con2">
                <img src="Group 22.png" alt="mobile developer">
            </div>
        </main>
        <img class="iosa" src="Rectangle.png" alt="">
    </div>
</body>

</html>
